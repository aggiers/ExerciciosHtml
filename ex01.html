<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
</head>
<body>
    <header>
        <h1>Lista de tarefas</h1>
    </header>

    <main>
        <input type="text" name="" id="tarefa" placeholder="Digite uma tarefa">
        <button onclick="adicionarTarefa()">Adicionar</button>

        <ul id="lista-de-tarefas">
            <li>item 01</li>
            <li>item 02</li>
            <li>item 03</li>
            <li>item 04</li>
        </ul>

    </main>

    <footer></footer>

</body>

<script>
    function adicionarTarefa(){

        // cadastrar um item na lista
        let valorInput = document.getElementById("tarefa").value;

        // console.log(valorInput);
        let itemLista = document.createElement("li")
        itemLista.innerText = valorInput;

        document.getElementById("lista-de-tarefas").appendChild(itemLista);

        // botão de excluir
        let botaoExcluir = document.createElement("button");
        botaoExcluir.innerHTML = "Remover item"

        itemLista.appendChild(botaoExcluir);
        // assim que eu clicar no botao "excluir", ele será excluido junto ao item

        botaoExcluir.onclick = function(){
            itemLista.remove();
        }

        document.getElementById("tarefa").value = "";
    }

</script>

</html>
