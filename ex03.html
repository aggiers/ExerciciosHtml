<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Loja de Camisetas</title>

  <style>
    .item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .item p {
      margin: 0 10px 0 0;
    }
  </style>
  
</head>
<body>
  <h1>Camisetas</h1>

  <div class="item">
    <img id="imagem-preta" src="camisa-preta.webp" alt="">
    <p>Camiseta Preta - R$50</p>
    <button onclick="adicionarAoCarrinho('Camiseta Preta', 50)">Adicionar</button>
  </div>

  <div class="item">
    <img id="imagem-branca" src="camisa-branca.webp" alt="">
    <p>Camiseta Branca - R$40</p>
    <button onclick="adicionarAoCarrinho('Camiseta Branca', 40)">Adicionar</button>
  </div>

  <h1>Carrinho</h1>
  <ul id="listaCarrinho"></ul>
  <p id="total">Total: R$0</p>

  <script>

    let imgPreta = document.getElementById('imagem-preta');
    let imgBranca = document.getElementById('imagem-branca');

    imgPreta.style.width = '150px';
    imgPreta.style.height = '150px';

    imgBranca.style.width = '150';
    imgBranca.style.height = '150px';

    let total = 0;

    function adicionarAoCarrinho(nome, preco) {

      let lista = document.getElementById('listaCarrinho');
      let item = document.createElement('li');
      item.innerText = nome + ' - R$' + preco;
      lista.appendChild(item);

      total += preco;

      document.getElementById("total").innerText = 'Total: R$' + total;

      let botaoExcluir = document.createElement("button");
        botaoExcluir.innerHTML = "Remover item"

        item.appendChild(botaoExcluir);
        

        botaoExcluir.onclick = function(){
            item.remove();
            total -= preco;
            document.getElementById("total").innerText = 'Total: R$' + total.toFixed(2);
        }    

        
}

  </script>
</body>
</html>
